# GitHub Actions workflow for the design checks. It ships here because the bot that added it lacked the
# PROTECTED (design.md §0.5): agents must not edit or disable it without the owner's approval.
name: design-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: design-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: design-build/package-lock.json
      - name: Install check dependencies
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Self-test (lint fixtures, mutations, render fixture)
        run: node test/run.mjs
      - name: Lint (design docs, tokens, preview code)
        run: node lint.mjs
      - name: DTCG tokens check (Terrazzo)
        run: npm run tokens:check
      - name: Render + axe (390/768/1280 × light/dark)
        run: node render.mjs
      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-checks
          path: |
            design-build/screenshots/
            design-build/render-report.json
            design-build/a11y-report.json
          if-no-files-found: ignore
