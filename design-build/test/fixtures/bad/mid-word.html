<!-- expect-render: mid-word-break. A token name in a column too narrow for it, with break-all, so it wraps in the middle of a word. -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Mid-word break</title>
<style>body { margin: 2rem; font-family: monospace; } .cell { inline-size: 6ch; word-break: break-all; }</style></head>
<body><main><h1>Tokens</h1><div class="cell"><code data-token>color-brand-primary</code></div></main></body></html>
