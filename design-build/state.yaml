# §16 build state. The harness updates this after every step.
phase: 0            # 0 not started, 1 intake, 2 research, 3 studies, 4 fill, 5 review, 6 apply to app, done (§16)
gate_passed: false
project_type: []    # inferred in KICKSTART step 2
evidence: []        # file paths that showed the type
inventory: design-build/inventory.json   # KICKSTART step 2; components to reuse (§0.5)
research:
  started_at: null
  sources_used: 0
  competitors_used: 0
choices: {}         # Phase 3 picks per aspect, e.g. color: B
decisions:          # one entry per decision, e.g. - { date: 2026-10-28, section: §4, decision: "accent C", by: user, quote: "go with C, warmer" }
  # Template maintenance (the protected check files, §0.5), not design decisions for a project:
  - { date: 2026-10-28, section: "§0.5 checks", decision: "approved edits to the protected check files to fix the 28 Oct audit (P0–P2): lint.mjs (+ lib/jsx.mjs), lint.config.json (core.md placeholder count 211 → 219 for the new dark data colors), inventory.json ignore.tags (+ App), motion.mjs, render.mjs, hooks/after-edit.mjs and test/ (run.mjs, helpers-browser.mjs, new fixtures)", by: user, quote: "fix ALL P0, P1 and P2 items from your audit, INCLUDING edits to protected check files (lint.mjs, lint.config.json, inventory.json ignore, motion.mjs, tests)" }
  - { date: 2026-10-28, section: "§0.5 checks", decision: "after-the-fact approval of the lint.config.json edits in commit 780e0de (code_dirs += components; template_placeholders design/digital-product.md 6 → 5)", by: user, quote: "also the after-the-fact approval of the lint.config.json edits in 780e0de" }
  - { date: 2026-10-28, section: "§0.5 checks", decision: "the design board replaces the preview and studies pages: new lint rule board-stale in lint.mjs, new board tests in test/run.mjs (and assets/ copied into the test sandboxes); render.mjs, motion.mjs, hooks and lint.config.json unchanged, no check loosened", by: user, quote: "you MAY add new checks/scripts and update render.mjs/motion.mjs/test targets as strictly needed for the board replacing the preview, but do NOT loosen any existing check" }
  - { date: 2026-10-28, section: "§0.5 checks", decision: "the live board (board.mjs --serve --watch, lib/live.mjs): added three tests to test/run.mjs and a new helper test/live-check.mjs (watch triggers a rebuild, SSE reload names the changed tiles, bad JSON or YAML keeps the last good board with file:line and recovers, the snippet is only in served HTML, busy port, --poll, Ctrl+C, and a Playwright run for reload, scroll, zoom, toast and banner); no existing test, check, baseline, lint.config.json, hook, CI file or render or motion script changed", by: user, quote: "Don't loosen existing checks; record the change in the state.yaml decisions" }
# Phase 5 verdicts (accept = locked; don't change an accepted section unless the user reopens it) live in design-build/review.json, written by board.mjs --review
apply:              # §16 Phase 6, apps only; starts after the Phase 5 gate and the user's yes
  started_at: null
  app_url: null      # dev-server URL render.mjs checked (also design-build/project.json → app_url)
  routes: []         # extra URLs rendered, e.g. http://localhost:5173/settings
  target_errors: 0   # hard-coded value errors allowed in app code when done (0, or the target the user agreed)
  accepted_by: null  # e.g. { date: 2026-10-28, by: user, quote: "looks right, ship it" }
completion: 0.0     # Phase 4 lint
version: "0.0.0"
# Written by `lint.mjs --record` and `render.mjs --record`, run after the last commit of the work. "Done" needs all three `pass` with commit = git rev-parse --short HEAD (§0.5).
checks:
  lint: { status: null, commit: null, at: null, errors: null, warnings: null }
  render: { status: null, commit: null, at: null, failures: null, screenshots: null }
  a11y: { status: null, commit: null, at: null, serious_or_critical: null, manual: null }
